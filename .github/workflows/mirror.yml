name: Mirror to EXOPA-OAPa

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        run: |
          git push --mirror https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/EXOPA-OAPa/photo-cat.git
