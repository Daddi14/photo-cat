# PHOTO-CAT - Photometric Contamination Analyzer Tool configuration
# You can edit this file manually, or run the starter for your operating system and use the GUI.
# Selecting Catalog CSV in the GUI auto-fills Targets CSV and the output/index folders.
# To use manual source_id targets, set TARGETS_INPUT to null and list IDs under targets.
# Default column names are Gaia-like. Column names are case-sensitive: ra != RA.
# Change them in the GUI only if your CSV headers differ.

build_neighbors_index:
  io:
    input_catalog: data/example_catalog.csv
    out_dir: data/output
    usecolumns:
    - source_id
    - ra
    - dec
    - phot_g_mean_mag
    columns:
      source_id: source_id
      ra: ra
      dec: dec
      phot_g_mean_mag: phot_g_mean_mag
    # Optional additional magnitude bands can be queried later with:
    # magnitude_columns:
    #   gaia_bp: phot_bp_mean_mag
    #   gaia_rp: phot_rp_mean_mag
    magnitude_columns:
      gaia_g: phot_g_mean_mag
  settings:
    use_dask: true
    calculate_separations: false
    max_radius_arcsec: 120.0
    chunk_size: 10000
    buffer_flush_interval: 200
query_contamination_from_index:
  io:
    INDEX_DIR: data/output
    TARGETS_INPUT: data/example_targets.csv
    targets: []
    target_source_id_column: source_id
  settings:
    field_of_view_arcsec: 47.0
    delta_mag: 5.0
    include_missing_targets: false
    contamination_bands:
    - gaia_g
    contamination_model:
      # top_hat preserves the historical catalogue/aperture flux estimate.
      # Opt-in alternatives: gaussian_psf or radial_weight.
      mode: top_hat
      gaussian_fwhm_arcsec:
      radial_weight_file:
execution:
  run_build: true
  run_query: true
  replace_running_pipeline: true
