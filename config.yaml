# PHOTO-CAT configuration
# You can edit this file manually, or run the starter for your operating system and use the GUI.
# Selecting Catalog CSV in the GUI auto-fills Targets CSV and the output/index folders.
# To use manual source_id targets, set TARGETS_INPUT to null and list IDs under targets.
# Default column names are Gaia-like. Column names are case-sensitive: ra != RA.
# Change them in the GUI only if your CSV headers differ.

interface:
  language: en
build_neighbors_index:
  io:
    input_catalog: data/example_catalog.csv
    out_dir: data/output
    usecolumns:
    - source_id
    - ra
    - dec
    - phot_g_mean_mag
    columns:
      source_id: source_id
      ra: ra
      dec: dec
      phot_g_mean_mag: phot_g_mean_mag
    magnitude_columns:
      gaia_g: phot_g_mean_mag
      # BP and RP are needed for the photometric band conversion (colour -> temperature).
      # Uncomment when your catalogue provides them.
      # gaia_bp: phot_bp_mean_mag
      # gaia_rp: phot_rp_mean_mag
  settings:
    use_dask: true
    calculate_separations: false
    max_radius_arcsec: 120.0
    chunk_size: 10000
    buffer_flush_interval: 200
query_contamination_from_index:
  io:
    INDEX_DIR: data/output
    TARGETS_INPUT: data/example_catalog.csv
    targets: []
    target_source_id_column: source_id
  settings:
    field_of_view_arcsec: 47.0
    delta_mag: 5.0
    include_missing_targets: false
    contamination_bands:
    - gaia_g
    # Optional: choose the reference/output band for contaminant selection and metrics.
    # If that band is stored in the index (for example gaia_bp), its nominal values
    # are used directly. Otherwise BP-RP converts each source into the chosen band.
    # A conversion requires the catalogue BP and RP columns in the index.
    # output_band: a built-in filter (gaia_g/bp/rp, tess, cheops, mauve, ariel_fgs1,
    #   ariel_fgs2, ariel_visphot, ariel_airs_ch0/ch1, ariel_nirspec), a band with a
    #   published Gaia relation (johnson_b/v/r, cousins_i, 2mass_j/h/ks, sdss_g/r/i/z,
    #   hipparcos_hp, tycho_bt/vt), "custom" with a filter_file, or any filter
    #   downloaded from SVO in the GUI.
    # conversion_method: blackbody integrates a spectrum through the band's filter and
    #   works for any curve; gaia_empirical applies the published Gaia colour relation,
    #   only for the bands and colour ranges it was calibrated on; auto uses that
    #   relation where it applies and blackbody elsewhere. phoenix needs external data.
    # Omit the block to skip the conversion entirely.
    photometric_conversion:
    #   output_band: tess
    #   conversion_method: blackbody
    #   filter_file:
    #   catalog: gaia_dr3
    contamination_model:
      mode: gaussian_psf
      gaussian_fwhm_arcsec: 120.0
      influence_sigma: 3.0
execution:
  run_build: true
  run_query: true
  replace_running_pipeline: true
